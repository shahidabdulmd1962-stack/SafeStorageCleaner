name: Repository Check

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  check:

    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Show Repository Tree
        run: |
          pwd
          ls -la
          find . -type f | sort

      - name: Upload Repository List
        uses: actions/upload-artifact@v4
        with:
          name: repository-files
          path: .
